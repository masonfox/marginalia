@media (max-width:1100px){.para{grid-template-columns:36px minmax(0,1fr);gap:0 14px}.mgn{grid-column:2}}
@media (max-width:760px){.sm-hide{display:none !important}.pad{padding-left:16px !important;padding-right:16px !important}}

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","sepia","light"],"default":"sepia"},"$preview":{"width":1440,"height":1650}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const t = st.theme || this.props.theme || 'sepia';
    const size = st.size || 20;
    const glossOn = st.gloss !== false;
    const set = (v) => () => this.setState({ theme: v });
    const P = (parts, gl, hl) => ({
      cls: 'para' + (hl ? ' hl' : ''),
      pop: !!hl,
      parts: parts.map((x) => typeof x === 'string' ? { t: x, cls: '' } : { t: x[0], cls: glossOn ? 'gw' : '' }),
      gl: gl.map((g) => ({ n: g[0], d: g[1] }))
    });
    return {
      theme: t,
      sbL: 'sb' + (t === 'light' ? ' on' : ''), sbS: 'sb' + (t === 'sepia' ? ' on' : ''), sbD: 'sb' + (t === 'dark' ? ' on' : ''),
      pL: t === 'light' ? 'true' : 'false', pS: t === 'sepia' ? 'true' : 'false', pD: t === 'dark' ? 'true' : 'false',
      setL: set('light'), setS: set('sepia'), setD: set('dark'),
      size: 'font-size: ' + size + 'px',
      smaller: () => this.setState({ size: Math.max(16, size - 1) }),
      bigger: () => this.setState({ size: Math.min(26, size + 1) }),
      glossOn: glossOn,
      glossAria: glossOn ? 'true' : 'false',
      toggleGloss: () => this.setState({ gloss: !glossOn }),
      swStyle: glossOn ? 'background: var(--accent)' : 'background: var(--line2)',
      knob: glossOn ? 'left: 19px' : 'left: 3px',
      paras: [
        P(['Call me ', ['Ishmael'], '. Some years ago—never mind how long precisely—having little or no money in my purse, and nothing particular to interest me on shore, I thought I would sail about a little and see the watery part of the world. It is a way I have of driving off the spleen and regulating the circulation. Whenever I find myself growing grim about the mouth; whenever it is a damp, drizzly November in my soul; whenever I find myself involuntarily pausing before coffin warehouses, and bringing up the rear of every funeral I meet; and especially whenever my hypos get such an upper hand of me, that it requires a strong moral principle to prevent me from deliberately stepping into the street, and methodically knocking people’s hats off—then, I account it high time to get to sea as soon as I can.'], [['Ishmael', 'The narrator. He gives no other name.']], false),
        P(['This is my substitute for pistol and ball. With a philosophical flourish ', ['Cato'], ' throws himself upon his sword; I quietly take to the ship. There is nothing surprising in this. If they but knew it, almost all men in their degree, some time or other, cherish very nearly the same feelings towards the ocean with me.'], [['Cato', 'Roman statesman who took his own life rather than submit to Caesar.']], true),
        P(['There now is your insular city of the ', ['Manhattoes'], ', belted round by wharves as Indian isles by coral reefs—commerce surrounds it with her surf. Right and left, the streets take you waterward. Its extreme downtown is the battery, where that noble mole is washed by waves, and cooled by breezes, which a few hours previous were out of sight of land. Look at the crowds of water-gazers there.'], [['Manhattoes', 'Manhattan, by an old name.']], false),
        P(['Circumambulate the city of a dreamy Sabbath afternoon. Go from ', ['Corlears Hook'], ' to ', ['Coenties Slip'], ', and from thence, by Whitehall, northward. What do you see?—Posted like silent sentinels all around the town, stand thousands upon thousands of mortal men fixed in ocean reveries.'], [['Corlears Hook', 'A point on Manhattan’s East River shore.'], ['Coenties Slip', 'A filled-in inlet at the island’s southern tip.']], false)
